[project]
name = "sentinel-backend"
version = "1.0.0"
description = "FastAPI backend for SENTINEL novelty-driven rare-event intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "torch",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "imbalanced-learn>=0.12.0",
    "websockets>=13.0",
    "python-multipart>=0.0.18",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
